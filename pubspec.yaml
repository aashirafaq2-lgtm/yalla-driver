name: yalla_driver
description: "Yalla - Driver App"
publish_to: 'none'
version: 1.0.1+9

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  provider: ^6.1.1
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_local_notifications: ^17.2.2
  device_info_plus: ^11.1.0
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  permission_handler: ^11.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
