workflows:
  build-release:
    name: Yalla Driver iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Yalla ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alsamarie.yallaDriver
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up dependencies
        script: |
          flutter packages pub get
      - name: Build iOS App (No Codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Build and Sign IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --config "Release"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
