workflows:
  build-release:
    name: Yalla Driver iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Yalla Driver Key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup Custom Keychain and Profiles
        script: |
          keychain initialize
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          cp Yalla_Driver_AppStore.mobileprovision "$PROFILES_HOME/"
          keychain add-certificates --certificate ios_distribution.p12 --certificate-password 12345
          xcode-project use-profiles
      - name: Build Flutter IPA
        script: |
          flutter packages pub get
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
      - name: Upload to TestFlight
        script: |
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -n "$IPA_FILE" ]; then
            app-store-connect publish --path "$IPA_FILE" --apple-id 6805273240 --testflight || true
          fi
    publishing:
      app_store_connect:
        auth: integration
        apple_id: 6805273240
        submit_to_testflight: true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log

