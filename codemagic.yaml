workflows:
  ios-release:
    name: Yalla Driver - iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Yalla ASC Key   # Codemagic > Teams > Integrations me yeh naam se App Store Connect API key add karo

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alsamarie.yallaDriver
      flutter: stable

      xcode: latest
      cocoapods: default

    scripts:
      - name: Set Flutter version
        script: flutter --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
        working_directory: .

      - name: Set up automatic code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.alsamarie.yallaDriver \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles


      - name: Build Flutter IPA for App Store
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - ahmed@yalla.iq          # apna email daalo
        notify:
          success: true
          failure: true
