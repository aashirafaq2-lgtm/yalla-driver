workflows:
  build-release:
    name: Yalla Driver iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Yalla ASC Key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up dependencies
        script: |
          flutter packages pub get
      - name: Setup Custom Keychain and Profiles
        script: |
          keychain initialize
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          cp Yalla_Driver_AppStore.mobileprovision "$PROFILES_HOME/"
          keychain add-certificates --certificate ios_distribution.p12 --certificate-password 12345
      - name: Build iOS App (No Codesign)
        script: |
          flutter packages pub get
          flutter build ios --release --no-codesign
      - name: Build and Sign IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --config "Release"
      - name: Upload to App Store Connect
        script: |
          app-store-connect publish \
            --path $(find /Users/builder -name "*.ipa" | head -n 1) \
            --testflight
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log


